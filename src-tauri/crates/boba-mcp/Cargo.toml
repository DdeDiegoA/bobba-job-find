[package]
name = "boba-mcp"
description = "stdio <-> local-IPC shim binary, shipped as a Tauri externalBin (AD-6)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The bin target is `boba-mcp-shim`, not `boba-mcp`: `tauri-build` copies the
# `binaries/boba-mcp-<triple>` sidecar into `target/<profile>/boba-mcp`, and a
# bin of that name races the copy and loses, leaving tests a 0-byte,
# non-executable file (FX20). The shipped sidecar keeps the name `boba-mcp`.
[[bin]]
name = "boba-mcp-shim"
path = "src/main.rs"

[dependencies]
boba-mcp-proto = { path = "../boba-mcp-proto" }
serde_json = { workspace = true }

[dev-dependencies]
interprocess = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
