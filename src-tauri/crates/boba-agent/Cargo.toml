[package]
name = "boba-agent"
description = "CLI drivers, process supervisor and agent-pack renderer (AD-4, AD-6)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
boba-domain = { path = "../boba-domain" }
boba-app = { path = "../boba-app" }
boba-mcp-proto = { path = "../boba-mcp-proto" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Run ids (AD-17) and process-group / Job Object spawning (AD-1).
ulid = { workspace = true }
process-wrap = { workspace = true, features = ["std"] }
# MCP endpoint (AD-6): owner-only local socket / named pipe, plus per-run token bytes.
interprocess = { workspace = true }
getrandom = { workspace = true }
