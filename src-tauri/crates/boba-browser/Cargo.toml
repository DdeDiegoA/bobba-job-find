[package]
name = "boba-browser"
description = "CDP automation of the user's own Chrome (AD-10, AD-11)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
boba-domain = { path = "../boba-domain" }
boba-app = { path = "../boba-app" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The user's own Chrome over CDP (AD-10, S9.4): headed, no bundled Chromium
# (the `fetcher` feature stays off). The handler runs on its own runtime, so
# `BrowserPort` can stay a synchronous, testable surface.
chromiumoxide = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
# Whether a Linux keyring holds Chrome's cookie key (S11.1a): the same store
# the app installs at unlock (S1.2a), read-only here.
keyring-core = { workspace = true }
