[package]
name = "boba-docs"
description = "Typst/DOCX renderers and document verification (AD-14, AD-15)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
boba-domain = { path = "../boba-domain" }
boba-app = { path = "../boba-app" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Embedded Typst renderer (ADR-006): no TeX toolchain, deterministic output.
typst = { workspace = true }
typst-as-lib = { workspace = true }
typst-layout = { workspace = true }
typst-pdf = { workspace = true }

# Reads the text layer back out of a PDF (S7.6, FR-77, ADR-006). Only ever on a
# PDF this process just rendered — never on a user-supplied file.
pdf-extract = { workspace = true }

# DOCX export (S7.7, FR-78). The `image` feature is off on purpose: a document
# Boba writes carries no picture, and turning it on would pull a decoder for
# every user-supplied image format into the build (ADR-010: nothing here reads
# a file a user or an agent handed us).
docx-rs = { workspace = true, default-features = false }

[dev-dependencies]

[lints]
workspace = true
