[package]
name = "boba-docs"
description = "Typst/DOCX renderers and document verification (AD-14, AD-15)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
boba-domain = { path = "../boba-domain" }
boba-app = { path = "../boba-app" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Embedded Typst renderer (ADR-006): no TeX toolchain, deterministic output.
typst = { workspace = true }
typst-as-lib = { workspace = true }
typst-layout = { workspace = true }
typst-pdf = { workspace = true }

[dev-dependencies]
# Extracts the PDF text layer so tests can assert real text (S7.1, AD-14).
pdf-extract = { workspace = true }
