[package]
name = "boba-sources"
description = "Source adapters, registry and shared HttpClient (AD-9, AD-10, AD-19)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
boba-domain = { path = "../boba-domain" }
boba-app = { path = "../boba-app" }
serde = { workspace = true, features = ["derive"] }
# ATS payloads (S4.5) are parsed by field, never into a serde struct, so a
# source adding a field never breaks a board.
serde_json = { workspace = true }
# RSS/Atom for the remote feeds (S4.6, WeWorkRemotely): tech-stack.md pins
# feed-rs as the one feed parser in the tree.
feed-rs = { workspace = true }
thiserror = { workspace = true }
# The shared outbound client (AD-10):
reqwest = { workspace = true }
governor = { workspace = true }
texting_robots = { workspace = true }
ammonia = { workspace = true }
# The session page budget is a local-day total (S11.1b), like the Auto caps.
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
# `test-util` lets the session-adapter tests run the human-like pacing on
# tokio's virtual clock instead of waiting it out (S11.1b).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
