[package]
name = "boba-app"
description = "Use cases and port traits (hexagonal core)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# On-device F3 semantic score (AD-8). Opt-in download; needs no network at build.
embeddings = ["dep:fastembed"]

[dependencies]
boba-domain = { path = "../boba-domain" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
html2text = { workspace = true }
ammonia = { workspace = true }
lingua = { workspace = true, default-features = false, features = ["english", "spanish"] }
time = { workspace = true }
fastembed = { workspace = true, optional = true }
# Master CV import (S3.5): the user's own PDF, DOCX and LinkedIn export ZIP are
# read here (never written), so the use case owns its extraction.
pdf-extract = { workspace = true }
# `deflate` only, the same set docx-rs asks for: DEFLATE is all a DOCX or a
# LinkedIn export uses. The default features would add bzip2/lzma/zstd/aes,
# whose licenses (and decoders) this slice has no use for.
zip = { workspace = true, default-features = false, features = ["deflate"] }
quick-xml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Fixtures the extraction tests build in memory (a real PDF, a real DOCX ZIP).
lopdf = { workspace = true }
tempfile = { workspace = true }
