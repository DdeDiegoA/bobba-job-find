[package]
name = "boba-mcp-proto"
description = "MCP tool schemas shared by the core and the boba-mcp shim (AD-6)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
# Local IPC endpoint (owner-only socket / pipe) shared by the shim and the core.
interprocess = { workspace = true }

# The Windows pipe carries an explicit owner-only DACL (AD-6); the descriptor is
# built from an SDDL string, which the Windows API takes as UTF-16.
[target.'cfg(windows)'.dependencies]
widestring = { workspace = true }
