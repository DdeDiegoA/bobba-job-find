[package]
name = "boba-job-find"
description = "Boba Job Find desktop app (Tauri v2 shell + wiring)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "boba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-log = { workspace = true }
# Typed IPC (AD-3): tauri-specta exports src/lib/ipc/bindings.ts.
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
specta = { workspace = true, features = ["derive", "serde_json"] }
specta-typescript = { workspace = true }
# Hexagonal core (use cases + the AppError model).
boba-app = { path = "crates/boba-app" }
# Port types that cross into the commands (S7.7): the studio reads an
# application, its Offer and the Profile, and hands them to `boba-app`.
boba-domain = { path = "crates/boba-domain" }
# The renderers behind `RenderPort`/`VerifyPort` (S7.7 mounts them).
boba-docs = { path = "crates/boba-docs" }
# Composition root (ADR-012): the store adapter wiring opens and mounts.
boba-store = { path = "crates/boba-store" }
# Composition root (CH5, ADR-012): the agent runtime is built and mounted here.
boba-agent = { path = "crates/boba-agent" }
boba-mcp-proto = { path = "crates/boba-mcp-proto" }
# Email connections (S8.1): the Graph/OAuth adapter is mounted as a port here.
boba-mail = { path = "crates/boba-mail" }
# Browser automation (S9.4, AD-10): the ATS Form port drives the user's Chrome.
boba-browser = { path = "crates/boba-browser" }
# Manual intake (S4.7): the shared outbound HTTP client is mounted here.
boba-sources = { path = "crates/boba-sources" }
# Resolving a pasted URL and a redirect's `Location` (S4.7).
url = { workspace = true }
# The OS locale, for the core-side tray strings (S1.6, AD-17/AD-21).
sys-locale = { workspace = true }
# The scheduler's run times are local wall clock (S5.1, FR-41): `local-offset`
# gives it the current UTC offset, so a DST change moves the run with the clock.
time = { workspace = true, features = ["local-offset"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

# Desktop-only plugins (updater + process/relaunch).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }

# Unit tests build a mock Tauri app and the store without the OS keychain.
[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
# The manual-intake fetch (S4.7) is tested against a local HTTP server.
wiremock = { workspace = true }
