[package]
name = "boba-fake-cli"
description = "Fake agent CLI used by run-lifecycle tests (owned by S2.2)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "boba-fake-cli"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
# Wire contract for the run's MCP endpoint (AD-6): the `mcp-run` mode speaks it
# the way a real CLI's `boba-mcp` shim does.
boba-mcp-proto = { path = "../../src-tauri/crates/boba-mcp-proto" }
