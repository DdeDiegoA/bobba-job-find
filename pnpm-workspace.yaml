# pnpm 11 settings (moved out of package.json / .npmrc).
#
# allowBuilds: dependency build scripts must be approved explicitly. The only
# native build here is @swc/core (pulled in by i18next-cli).
#
# minimumReleaseAgeExclude: this environment applies a global "minimum release
# age" supply-chain policy; these are the versions the pinned lockfile needs.
# On a machine without that policy they are simply ignored.
allowBuilds:
  "@swc/core": true
minimumReleaseAgeExclude:
  - "@tanstack/react-table@9.2.6"
  - "@tanstack/table-core@9.2.6"
  - "data-urls@8.0.0"
  - "jsdom@30.1.2"
  - "lucide-react@1.52.0"
  - "tr46@7.0.0"
  - "whatwg-url@17.2.0"
