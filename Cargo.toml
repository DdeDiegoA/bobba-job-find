# Boba Job Find — Cargo workspace (S1.1)
#
# One workspace, one lockfile: every crate under src-tauri/crates plus the Tauri
# app. Versions are pinned here ONCE from docs/architecture/tech-stack.md so a
# later slice that needs a dependency does not touch a lockfile unless it lists
# one in its `files` (backlog ownership convention 2).
#
# Dependency rules enforced by src-tauri/tests/dependency_rules.rs (AC2, AD-16):
#   * boba-domain depends only on serde, thiserror, time and ulid.
#   * adapters never depend on each other.
#   * boba-app never depends on an adapter or on Tauri.

[workspace]
resolver = "3"
members = [
    "src-tauri",
    "src-tauri/crates/*",
    "tools/fake-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/diegoarenas/boba-job-find"

[workspace.dependencies]
# --- Shell and platform (Stack table: Tauri 2.12.x) ---
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2.10"
tauri-specta = "=2.0.0-rc.25"
specta = "=2.0.0-rc.25"

# --- Core crates ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }
jsonschema = "0.58"
ulid = { version = "3.0", features = ["serde"] }
time = { version = "0.3", features = ["serde-well-known"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# --- Storage / crypto ---
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.6"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
keyring-core = "1.0"
apple-native-keyring-store = "1.0"
windows-native-keyring-store = "1.1"
dbus-secret-service-keyring-store = "1.0"
secrecy = "0.10"
zeroize = "1.9"
getrandom = "0.4"
argon2 = "0.6"
blake3 = "1.8"

# --- Platform utilities ---
nix = { version = "0.31", default-features = false, features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# --- Network / sources ---
reqwest = { version = "0.13", features = ["rustls-tls", "json"] }
governor = "0.10"
texting_robots = "0.2"
feed-rs = "3.0"
scraper = "0.27"
ammonia = "4.2"
html2text = "0.17"
jsonpath-rust = "1.0"
lingua = "1.8"
simhash = "0.3"
fastembed = "7.1" # optional feature on boba-app (`embeddings`); AD-8 F3

# --- Agent runtime / process ---
cron = "0.17"
process-wrap = { version = "10.0", features = ["tokio1"] }
interprocess = "2.4"
which = "8.0"
dirs = "7.0"
sys-locale = "0.3"
rmcp = "3.5"

# --- Documents / AV / mail ---
typst = "0.15"
typst-pdf = "0.15"
typst-as-lib = "0.16"
pdf-extract = "0.12"
lopdf = "0.45"
docx-rs = "0.4.22"
chromiumoxide = "0.9"
lettre = "0.11"
async-imap = "0.12"
mail-parser = "0.11"
oauth2 = "5.0"

# --- Test / dev ---
wiremock = "0.6"
insta = "1.49"
tempfile = "3"
toml = "0.9"
