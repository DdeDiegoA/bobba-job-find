# Boba Job Find — Cargo workspace (S1.1)
#
# One workspace, one lockfile: every crate under src-tauri/crates plus the Tauri
# app. Versions are pinned here ONCE from docs/architecture/tech-stack.md so a
# later slice that needs a dependency does not touch a lockfile unless it lists
# one in its `files` (backlog ownership convention 2).
#
# Dependency rules enforced by src-tauri/tests/dependency_rules.rs (AC2, AD-16):
#   * boba-domain depends only on serde, thiserror, time and ulid.
#   * adapters never depend on each other.
#   * boba-app never depends on an adapter or on Tauri.

[workspace]
resolver = "3"
members = [
    "src-tauri",
    "src-tauri/crates/*",
    "tools/fake-cli",
]

[workspace.package]
version = "1.0.0-beta.3"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/DdeDiegoA/bobba-job-find"

# Workspace lints (CH13). Every member opts in with `[lints] workspace = true`;
# CI runs `cargo clippy -- -D warnings`, so a `warn` here fails the build.
# Keep the list short and already satisfied: a lint that fights existing code
# is noise, not a gate.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
# `unimplemented` is intentionally allowed: mail test doubles stub the calls
# the send/read path never makes ("not used by the send path").

[workspace.dependencies]
# --- Shell and platform (Stack table: Tauri 2.12.x) ---
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2.10"
tauri-specta = "=2.0.0-rc.25"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"

# --- Core crates ---
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }
jsonschema = "0.58"
ulid = { version = "3.0", features = ["serde"] }
time = { version = "0.3", features = ["serde-well-known"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# --- Storage / crypto ---
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.6"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
keyring-core = "1.0"
apple-native-keyring-store = "1.0"
windows-native-keyring-store = "1.1"
dbus-secret-service-keyring-store = "1.0"
secrecy = "0.10"
zeroize = "1.9"
getrandom = "0.4"
argon2 = "0.6"
blake3 = "1.8"

# --- Platform utilities ---
nix = { version = "0.31", default-features = false, features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# --- Network / sources ---
# reqwest 0.13 renamed the rustls feature from `rustls-tls` to `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
governor = "0.10"
texting_robots = "0.2"
feed-rs = "3.0"
scraper = "0.27"
ammonia = "4.2"
html2text = "0.17"
jsonpath-rust = "1.0"
lingua = "1.8"
simhash = "0.3"
# Optional feature on boba-embed (`embeddings`, forwarded by src-tauri);
# AD-8 F3. boba-app never depends on it (AC3, S6.9). Pinned to the same two
# TLS features as fastembed's `default` (minus `image-models`, unused here) so
# the dependency set does not drift when the default feature resets.
fastembed = { version = "7.1", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }

# The model cache the F3 encoder downloads into (S6.9): the same client
# fastembed uses, so the bytes land in one layout and can be hashed before the
# ONNX runtime parses them. Features come from fastembed's own selection.
hf-hub = { version = "0.5", default-features = false }

# --- Agent runtime / process ---
cron = "0.17"
# process-wrap: std frontend + process-group (Unix) / JobObject (Windows), as
# AD-1 requires for kill-tree. Was tokio1 pre-S2.2; no crate depended on it yet.
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
interprocess = "2.4"
# Windows named-pipe security descriptors: interprocess takes an SDDL string as
# UTF-16, and `widestring` is what its own Windows backend uses (AD-6).
widestring = "1"
which = "8.0"
dirs = "7.0"
sys-locale = "0.3"
rmcp = "3.5"

# --- OAuth (S8.1) ---
# PKCE S256 needs SHA-256 and base64url; `url` builds and parses the loopback
# redirect. All three were already in the lock (transitively), so pinning them
# here adds no crate and no version.
sha2 = "0.10"
base64 = "0.22"
url = { version = "2.5", default-features = false }

# --- Documents / AV / mail ---
typst = "0.15"
typst-pdf = "0.15"
typst-as-lib = "0.16"
# Typst layout engine types (S7.1): PagedDocument for layout introspection.
typst-layout = "0.15"
pdf-extract = "0.12"
lopdf = "0.45"
docx-rs = "0.4.22"
# Master CV import (S3.5): read the user's own DOCX/ZIP files. `zip` must stay
# >= 9.0.3: the deny.toml advisories RUSTSEC-2026-0367/0368/0369 are ignored by
# id for the updater's zip 4.6.1, so an 8.x here would pass cargo-deny silently.
# (9.0.0–9.0.2 are yanked.) docx-rs keeps its own zip 8.x for writing.
zip = "9.0.3"
quick-xml = "0.42"
# The PDF bomb pre-scan (S3.5 review F2): inflate a FlateDecode stream with a
# byte cap so a small PDF cannot expand into gigabytes before `pdf-extract`
# reads it. Already in the lock through zip/pdf-extract.
flate2 = "1"
chromiumoxide = "0.9"
lettre = "0.11"
async-imap = "0.12"
mail-parser = "0.11"
# Platform TLS for the IMAP/SMTP sockets (S8.2). Already in the lock through
# lettre/reqwest; pinned here so both crates share the exact same versions.
native-tls = "0.2"
tokio-native-tls = "0.3"
oauth2 = "5.0"

# --- Test / dev ---
wiremock = "0.6"
insta = "1.49"
tempfile = "3"
toml = "0.9"

# --- Build profiles ---
# Dev builds: keep line tables only in our own crates and no debuginfo for
# dependencies. Backtraces still show file:line, but target/ is far smaller
# (disk was the incident). Release profile and split-debuginfo are untouched.
#
# Incremental compilation is off (CH12): its cache is what grows target/ into
# the tens of gigabytes on this workspace, and a fresh gate run rebuilds from
# scratch either way.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# `profile.test` inherits `dev`; the cache that matters for `cargo test` is its
# own, so the same switch is repeated here rather than assumed.
[profile.test]
incremental = false
