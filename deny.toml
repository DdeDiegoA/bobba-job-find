# cargo-deny configuration (S1.1; S1.8 supply-chain gate) — from tech-stack.md §6.
# Run: cargo deny check   (installed in CI by S1.8; optional locally)
#
# Licence policy: MIT/Apache-2.0 compatible only. No GPL/AGPL/LGPL-static.
# The Mozilla CA data crates (webpki-roots, webpki-root-certs) ship under
# CDLA-Permissive-2.0; that licence is granted as a targeted exception below,
# NOT added to the global allow list.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = []
# Fail only when one of *our* direct dependencies is unmaintained; transitive
# unmaintained crates (e.g. paste, proc-macro-error) do not fail the build.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "CC0-1.0",
    "CC-BY-4.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9

# Mozilla CA root data (Apache-2.0 project, CDLA-Permissive-2.0 licence).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our workspace crates are all `publish = false`, so their path dependencies are
# internal and exempt from the wildcard ban (which still applies to crates.io).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
