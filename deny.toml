# cargo-deny configuration (S1.1) — supply-chain gate from tech-stack.md §6.
# Run: cargo deny check   (installed in CI by S1.8; optional locally)
#
# Licence policy: MIT/Apache-2.0 compatible only. No GPL/AGPL/LGPL-static.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
# Every ignore is a security decision approved by Diego (orquestador policy).
# Format: id + crate + why it can't be removed + revisit trigger.
ignore = [
    # paste 1.0.15 (unmaintained, archived; proc-macro, compile-time only, no known vuln).
    # Pulled by tokenizers -> fastembed (optional `embeddings` feature, AD-8 F3). No alternative
    # tokenizer for fastembed. Revisit: tokenizers drops paste, or switch to pastey.
    { id = "RUSTSEC-2024-0436", reason = "paste via tokenizers/fastembed; compile-time proc-macro, no vuln" },
    # proc-macro-error 1.0.4 (unmaintained; proc-macro, compile-time only, no known vuln).
    # Pulled on Linux by gtk-rs 0.18 (glib-macros) -> tray-icon/wry -> tauri. Owned by Tauri upstream.
    # Revisit: Tauri moves to gtk-rs >= 0.19 / GTK4.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk-rs 0.18/tauri on Linux; compile-time proc-macro, no vuln" },
    # --- CH2 (2026-10-05): transitive advisories via the typst stack (pulled by boba-docs). ---
    # bincode 1.3.3 (unmaintained; upstream declared 1.3.3 final, no known vuln).
    # Path: syntect -> two-face -> typst-library -> typst -> boba-docs (syntax highlighting).
    # Revisit: typst drops syntect/two-face, or syntect moves off bincode.
    { id = "RUSTSEC-2025-0141", reason = "bincode via syntect/two-face/typst-library; unmaintained, no vuln" },
    # rustybuzz 0.20.1 (unmaintained; no known vuln).
    # Path: krilla/typst-layout -> typst-pdf/typst -> boba-docs (font shaping).
    # Revisit: typst migrates to harfrust.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via krilla/typst-layout/typst-pdf; unmaintained, no vuln" },
    # ttf-parser 0.25.1 (unmaintained; no known vuln).
    # Path: fontdb -> krilla-svg/typst-library -> typst -> boba-docs (font parsing).
    # Revisit: typst migrates to skrifa (fontations).
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdb/krilla-svg/typst-library; unmaintained, no vuln" },
    # yaml-rust 0.4.5 (unmaintained; no known vuln).
    # Path: syntect -> two-face -> typst-library -> typst -> boba-docs (theme YAML).
    # Revisit: syntect drops yaml-rust.
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust via syntect/two-face/typst-library; unmaintained, no vuln" },
    # quick-xml 0.38.4 [vuln] DoS: O(N^2) duplicate-attribute check; unbounded NsReader allocation.
    # Path: citationberg -> hayagriva -> typst-library -> typst -> boba-docs.
    # Unreachable: only citation/CSL XML parsing; our templates (render_cv/render_cover) use no
    # #bibliography/#cite and parse only our own templates, never untrusted XML.
    # No fixed release: citationberg 0.7.0 (latest) pins quick-xml ^0.38.1; typst stack already latest.
    # Revisit: citationberg allows quick-xml >=0.41, or typst bumps its citation stack.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via citationberg/hayagriva/typst-library; citations unused by our templates, unreachable" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via citationberg/hayagriva/typst-library; citations unused by our templates, unreachable" },
    # --- CH3 (2026-10-15): unsafe-libyaml, approved by Diego. ---
    # unsafe-libyaml 0.2.11 (unmaintained; upstream archived 2024-03-25, patched = [] i.e. no safe
    # upgrade exists, no known vuln).
    # Path: serde_yaml 0.9.34+deprecated -> hayagriva / typst-library -> typst -> boba-docs.
    # Reached only from CSL/bibliography parsing (hayagriva) and typst's `yaml()` / data-file
    # loading. Unreachable: our four templates (cv|cover/{classic,modern}.typ) only do
    # `json(sys.inputs.data)` — no #cite, #bibliography, yaml() or file reads — and never parse
    # untrusted YAML. Same reachability argument as CH2's RUSTSEC-2024-0320.
    # Revisit: hayagriva/typst drops serde_yaml (re-assessed by every E7 slice, see the standing
    # guard in docs/product/backlog.md and IB-2).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml/hayagriva/typst-library; unmaintained, no safe upgrade, YAML path unreachable from our templates" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "CC0-1.0",
    "CC-BY-4.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Diego 2026-10-15: interprocess deps doctest-file/recvmsg (S2.3a)
    "0BSD",
]
confidence-threshold = 0.9

# CDLA-Permissive-2.0 (Mozilla CA root data, not code). Scoped to the two root-store crates only.
# webpki-root-certs: reqwest 0.13 -> rustls-platform-verifier (tauri + our HttpClient).
# webpki-roots: ureq -> hf-hub -> fastembed model download.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our path deps are private (publish = false on every workspace crate).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
