<?xml version="1.0" encoding="UTF-8"?>
<!-- Boba Job Find — "Pearl Lens" mark (color). 64x64. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Boba Job Find logo: a magnifying glass whose lens holds three boba pearls, with a straw">
  <title>Boba Job Find</title>
  <!-- straw (drawn first so the lens tucks it in) -->
  <path d="M38 21 L46 7" fill="none" stroke="#C07430" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M40.2 17.4 L44.4 10.0" fill="none" stroke="#F7E7D3" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <!-- lens / cup -->
  <circle cx="27" cy="31" r="15.5" fill="#FFFBF5" stroke="#9A5418" stroke-width="4"/>
  <!-- handle -->
  <path d="M38.5 42.5 L51 55" fill="none" stroke="#9A5418" stroke-width="5.5" stroke-linecap="round"/>
  <!-- pearls -->
  <circle cx="21.5" cy="28" r="4" fill="#2E7D46"/>
  <circle cx="30.5" cy="25.5" r="4" fill="#5B3E8A"/>
  <circle cx="26.5" cy="34.5" r="4" fill="#B87A46"/>
  <!-- pearl glints -->
  <circle cx="20.3" cy="26.7" r="1.1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="29.3" cy="24.2" r="1.1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="25.3" cy="33.2" r="1.1" fill="#FFFFFF" opacity="0.8"/>
</svg>
