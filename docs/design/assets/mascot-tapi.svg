<?xml version="1.0" encoding="UTF-8"?>
<!-- Boba Job Find — mascot "Tapi" (idle). A single tapioca pearl with a tea-leaf sprout.
     Expressive via eyes/pose only; ~120px max in-product, 64px in notifications. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Tapi, the Boba Job Find mascot: a smiling tapioca pearl with a tea leaf">
  <title>Tapi</title>
  <!-- leaf sprout -->
  <path d="M48 27 C48 21 48 18 48 15" fill="none" stroke="#2E7D46" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M48 18 C54 14 60 15 62 19 C57 22 51 22 48 18 Z" fill="#2E7D46"/>
  <path d="M48 20 C43 16 37 17 35 21 C40 24 45 24 48 20 Z" fill="#3F8F55"/>
  <!-- body -->
  <circle cx="48" cy="57" r="30" fill="#B87A46"/>
  <!-- glossy highlight -->
  <ellipse cx="38" cy="45" rx="12" ry="9" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="33" cy="41" r="3.4" fill="#FFFFFF" opacity="0.55"/>
  <!-- eyes -->
  <circle cx="39" cy="54" r="3.4" fill="#2B201A"/>
  <circle cx="57" cy="54" r="3.4" fill="#2B201A"/>
  <circle cx="40.3" cy="52.7" r="1.1" fill="#FFFFFF"/>
  <circle cx="58.3" cy="52.7" r="1.1" fill="#FFFFFF"/>
  <!-- cheeks -->
  <ellipse cx="32" cy="63" rx="4.6" ry="3" fill="#D98D6A" opacity="0.55"/>
  <ellipse cx="64" cy="63" rx="4.6" ry="3" fill="#D98D6A" opacity="0.55"/>
  <!-- smile -->
  <path d="M42 64 Q48 69 54 64" fill="none" stroke="#2B201A" stroke-width="2.6" stroke-linecap="round"/>
</svg>
