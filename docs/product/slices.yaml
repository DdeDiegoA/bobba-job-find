  covers_extra: [AD-8]
  notes: Hexagonal fix (spine update 2026-10-05). New adapter crate boba-embed (publish = false) implements EmbeddingPort over fastembed behind cargo feature embeddings, forwarded by src-tauri. The EmbeddingPort trait lives in boba-app ports. The fastembed dep and embeddings feature are removed from boba-app/Cargo.toml, and boba-app/src/embeddings keeps only the opt-in and model-download use case with no fastembed import. Root Cargo.toml gains the boba-embed member. Depends on S1.8 because S1.8 last edited these manifests, and on S1.3p, which creates the ports/embedding.rs stub.
  ac_extra:
    - "Given boba-app, when I inspect its Cargo.toml and sources, then it has no fastembed dependency and no embeddings feature, and nothing under boba-app imports fastembed (hexagonal rule, AD-8)."
    - "Given a build without the embeddings feature, when the app runs, then F3 is unavailable and scoring is unchanged; with the feature, boba-embed provides EmbeddingPort and src-tauri forwards the feature."

