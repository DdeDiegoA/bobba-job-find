# Build slices for the MVP (E1–E11). Source of truth for docs/product/backlog.md and the root ./stories.yaml.
# Generated outputs: python3 scripts/gen_backlog.py [--wave N]   (check: --check)
#
# A slice is one dev session / one focused PR. Most slices map 1:1 to a story in epics-and-stories.md
# (parent). Stories too big for one PR are split (S1.2a/S1.2b, S2.3a/S2.3b, S11.1a/S11.1b).
#
# Path shorthands (expanded by the generator):
#   @c/            -> src-tauri/crates/
#   {loc:NAME}     -> locales/en/NAME.json and locales/es/NAME.json
#   {mig:NAME}     -> src-tauri/crates/boba-store/migrations/NNNN_NAME.sql (NNNN assigned in wave order)
#
# covers: inherited from the parent story; covers_extra adds IDs.
# ac_from: indexes into the parent story's AC list (docs/product/stories.yaml). Omitted = all parent ACs.
# wave: N = pinned to a wave already dispatched (history is not re-planned).
# first: true = dispatch as soon as its deps are merged (skeleton slices). last: true = runs after every other slice.
# ac_extra: slice-specific ACs (build conventions, moved ACs). gate: diego = needs Diego before merge.

