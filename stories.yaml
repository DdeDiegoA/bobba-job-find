  covers: [FR-83, FR-87, FR-108, AD-11, EXPERIENCE §9.12]
  ac: ["Given Settings → Applying, when I create an Auto Rule scoped to Sources × Apply Channels (Email Apply and ATS Form, plus Session Board for Sources with an active Auto opt-in from 11.3), then I set the minimum Rank and Fit, minimum Confidence, whether FLAGs are allowed (default no), the Verdict, a daily cap (default 5, maximum 25) and a per-company cap (default 1 per 30 days). A global cap (default 10 a day) and active hours also apply.", "Given `decide()`, when it is evaluated, then it returns Auto, Review(reasons) or Block(reasons), and the UI shows the reasons verbatim. Enforcement is core-only: `decide()` runs at attempt creation, at Outbox release and before submit, and settings ranges are validated by core commands. `auto` is selectable by default only for `ats_form`, `sanctioned_api` and `email`. Auto never applies to a VETO, a disallowed FLAG, a fraud badge, an unverified document, an unconfirmed language variant, a duplicate, a CLI without `tool_lockdown` or a Source without opt-in.", "Given enabling Auto for the first time, when I confirm the consequences dialog, then Auto turns on. Without that confirmation it stays off.", "Given this slice is merged, when the reviewer checks it, then auto submissions are spaced randomly (5–20 min) within active hours. 'Reset Apply to defaults' turns Auto off and restores the default caps (FR-108)."]
