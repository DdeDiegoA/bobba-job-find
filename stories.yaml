  covers: [FR-91, AD-11]
  ac: ["Given a Session Board Source, when I enable Auto, then this is a separate opt-in from 11.1: I read the ToS and ban warning and type the Source name. A persistent 'ToS risk' badge then shows on the Source and on its rules.", "Given Auto on that Source, when it runs, then the caps are 3 a day by default (hard maximum 10), at least 10 min apart, with an Outbox hold of at least 60 min, and the Kill Switch applies.", "Given a CAPTCHA, login challenge, 'unusual activity' warning or rate-limit response, when it is detected, then Auto pauses for that Source for 7 days and I am notified.", "Given 30 days since the opt-in, when it has not been re-confirmed, then the Source falls back to Review mode.", "Given this slice is merged, when the reviewer checks it, then enforcement lives only in the core. `decide()` runs when an attempt is created, when the Outbox releases it and right before submit. The settings commands reject values above 10/day. The opt-in is accepted only through a core command that receives the typed phrase and warning version, and audits both. The pause is stored in `source.paused_until`, and closing the UI cannot bypass holds, pacing or pauses."]
  gate: diego
