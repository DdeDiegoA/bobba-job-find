  ac: ["Given a `v*` tag, when the release workflow runs, then it builds a macOS universal DMG, a Windows NSIS installer (plus MSI) and a Linux AppImage, .deb and .rpm. The versions match the tag (enforced by CI), and the release is published, not left as a draft, with `latest.json`.", "Given the updater, when an update exists, then it is minisign-verified and installs only after a native confirmation. Update checks follow the opt-in decision in NFR-1.", "Given any macOS build (release, beta or CI artifact), when it is produced, then it is signed with the one persistent, project-owned self-signed identity and its pinned designated requirement. CI and `release.yml` fail if `codesign -dv` reports `Signature=adhoc` or a different designated requirement (ADR-009). Local `tauri dev` builds use the separate `app.bobajobfind.dev` keychain service and data dir.", "Given this slice is merged, when the reviewer checks it, then signing otherwise follows the free OSS path (Diego, 2026-10-04): documented Gatekeeper bypass on first macOS install; Windows ships unsigned with a documented SmartScreen bypass until the SignPath Foundation application is accepted; Apple Developer later, with the one-time Locked-state migration noted in the release notes. The LICENSE (MIT) includes the upstream notice."]
