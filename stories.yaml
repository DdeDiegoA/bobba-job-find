  ac: ["Given an Offer in Spanish, when I click Tailor, then both drafts are in Spanish (override available). For languages other than ES or EN, EN is used and a notice explains why.", "Given this slice is merged, when the reviewer checks it, then every claim-bearing item carries `fact_ids[]`, and missing keywords go into `declared_gaps[]`.", "Given boba-domain, when I inspect its Cargo.toml, then it still depends only on serde, thiserror, time and ulid, and boba-domain/src/documents holds CvDocument, CoverLetterDocument and their item and section types, schema_version, fact_ids, declared_gaps, TemplateId, LayoutReport (pages, orphans) and RenderedPdf (bytes, layout) (AD-14).", "Given boba-app::ports::RenderPort, when I read it, then it exposes templates() returning Vec of TemplateInfo, render_pdf taking a DocumentModel enum (Cv or CoverLetter), a TemplateId and a locale and returning RenderedPdf, and render_docx returning bytes, and every type in those signatures comes from boba-domain (AD-14).", "Given boba-docs, when it implements RenderPort, then it wraps S7.1's render_cv, render_cover and template registry, boba-docs/src/model is deleted with no re-export shim, and S7.1's existing tests pass unchanged apart from import paths.", "Given the workspace, when I run cargo check and inspect boba-app's Cargo.toml, then it passes and boba-app has no dependency on boba-docs (hexagonal rule).", "Given migration document_untrusted_origin, when it runs, then document gains untrusted_origin INTEGER NOT NULL DEFAULT 1 CHECK (untrusted_origin IN (0,1)) (forward-only, because 0003_documents.sql lacks it), drafts saved from tailor and review runs store untrusted_origin = 1, and the UI and Typst paths treat them as data only (ADR-010)."]
  notes: "S7.1 implemented boba-store repos/documents.rs before the DocumentRepo trait existed (accepted by the architect, 2026-10-05). This slice adds the trait in ports/repo/documents.rs and conforms S7.1's impl to it. RenderPort ruling (architect 2026-10-05, AD-14 and the Design Paradigm rule that every type crossing a port lives in boba-domain). This slice moves the document model from boba-docs/src/model to boba-domain/src/documents with no re-export shim, adds RenderPort over domain types only, and makes boba-docs implement it by wrapping S7.1's render_cv, render_cover and template registry. render_docx returns a not-yet-supported error until S7.7 fills it from boba-docs/src/docx. S7.1 is not reopened. Security guard (CH2, 9999bd8, Diego 2026-10-05). If this slice adds Typst cite or bibliography calls, or parses untrusted or user-supplied fonts, it must re-assess the cargo-deny ignores RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml via citationberg) and RUSTSEC-2026-0192 (ttf-parser), because those ignores rest on that code being unreachable. Re-assessing is a new security exception and needs Diego."
