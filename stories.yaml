  ac: ["Given a `session_browser` Source, when I enable it, then I must read a versioned warning and confirm. The warning names the account-ban risk and states that session cookies live in a dedicated browser profile protected by the browser's own OS encryption, not by Boba's. The opt-in is stored with its timestamp and warning version, and audited.", "Given the warning, when it is shown, then the cookie-protection sentence is specific to my platform (macOS Keychain, Windows DPAPI, Linux keyring). On Linux without a keyring, cookies are stored with weaker protection and I must give an extra, separate acknowledgement.", "Given an enabled Session Board Source, when I choose 'Sign out / clear session', then that Source's browser session and cookies are deleted, and the action is audited.", "Given this slice is merged, when the reviewer checks it, then session cookies are kept until that Source's 'Sign out / clear session' or Reset everything, and Settings → Privacy states this retention for each Session Board Source.", "Given this slice is merged, when the reviewer checks it, then the browser is driven over a pipe or an ephemeral loopback CDP endpoint, never a fixed port.", "Given this slice is merged, when the reviewer checks it, then the defaults are low volume and human-like pacing. Boba never creates accounts or solves CAPTCHAs, and a challenge pauses the Source and notifies me."]
