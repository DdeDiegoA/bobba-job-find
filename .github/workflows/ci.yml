# CI — quality gate for Boba Job Find (S1.8, NFR-6/NFR-22).
#
# Runs on every PR and on pushes to main, and is called by release.yml
# (`on: workflow_call`) as the gate every installer waits for (REL3): a release
# only builds after this whole workflow passes on the tagged commit. No signing
# secrets reach it — the tag-driven release is S10.5 (AD-22). This workflow never
# talks to a job board or an LLM; all fixtures are recorded (AD-16 / SPINE
# consistency).
#
# Every third-party action is pinned to a full commit SHA (enforced by
# scripts/ci/check-workflow-policy.mjs, run in the `hygiene` job).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      # REL3: release.yml passes the tag here. It keys the concurrency group, so
      # two release gates can never share one, and it turns cancellation off.
      gate:
        description: Concurrency key for a release gate; empty for normal runs
        required: false
        type: string
        default: ""

# A release supplies `gate` (its tag): the group is then per tag and
# cancel-in-progress is off, so a second dispatch can never cancel a gate that
# is already building installers. A `workflow_dispatch` run uses
# `refs/heads/main`, so without this key every dispatch shared one group (REL3
# review F1). Normal push/PR runs keep superseding their own predecessors.
concurrency:
  group: ci-${{ inputs.gate || github.ref }}
  cancel-in-progress: ${{ !inputs.gate }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tauri v2 Linux prerequisites (https://tauri.app/start/prerequisites/).
  # The Rust gate, the Linux build and the bindings export all compile the
  # desktop crate, so all three jobs install this one list; it lives here so
  # the three cannot drift (CH16: the web job lacked them and glib-sys died).
  LINUX_APT_PACKAGES: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    libxdo-dev build-essential pkg-config libssl-dev curl wget file

# Ubuntu runners are pinned to 24.04: `ubuntu-latest` moves to 26.04 on
# 2026-10-19 and some of the apt package names above change with it (CH16).
jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Actions pinned by SHA, no job-board/LLM endpoints
        run: node scripts/ci/check-workflow-policy.mjs
      # CH13: architecture conventions that no compiler sees — event names,
      # error catalogs, migrations, the IPC list and the port list.
      - name: Repository conventions
        run: node scripts/ci/check-conventions.mjs
      - name: stories.yaml fresh, deps acyclic, MVP FRs covered
        run: python3 scripts/gen_stories.py --check
      # S10.5 (AD-22): the updater pubkey in tauri.conf.json must stay a real
      # minisign public key, and the macOS identity pin must stay populated.
      - name: Release config guards
        run: |
          node scripts/release/verify-updater-pubkey.mjs
          grep -Eq '^BOBA_MACOS_CERT_SHA1=[0-9a-f]{40}$' scripts/release/macos-identity.pin || {
            echo "::error::scripts/release/macos-identity.pin has no pinned certificate (docs/install/RELEASING.md)"
            exit 1
          }

  web:
    name: Web (Biome, tsc, Vitest, i18n, bindings)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      # "Bindings are fresh" runs `cargo test` on the desktop crate, so this job
      # needs the Rust toolchain and the GTK/WebKit headers too. Without them
      # glib-sys fails pkg-config and gen-bindings exits 101 (CH16).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT_PACKAGES }}
      - name: Install (frozen lockfile, dependency scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Biome (lint + format check)
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: i18n catalogs match in EN and ES
        run: node scripts/ci/check-i18n.mjs
      - name: Bindings are fresh
        # scripts/gen-bindings.mjs is owned by S1.3 (build convention 4/AD-3).
        run: |
          node scripts/gen-bindings.mjs
          git diff --exit-code -- src/lib/ipc/bindings.ts

  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The workspace compiles the Tauri shell, whose Linux build scripts need
      # the GTK/WebKit headers: without them glib-sys fails pkg-config and
      # clippy dies with exit 101 before any lint runs (CH15).
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT_PACKAGES }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    name: Tauri build (${{ matrix.os }})
    needs: [hygiene, web, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The MCP endpoint's owner-only DACL (S2.3b) is Windows code: its
      # `#[cfg(windows)]` test compiles on every platform but only runs here.
      - name: MCP proto tests (Windows pipe DACL)
        if: runner.os == 'Windows'
        run: cargo test --locked -p boba-mcp-proto
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT_PACKAGES }}
      - name: Install (frozen lockfile, dependency scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tauri build, no bundle
        run: pnpm tauri build --no-bundle
      # S10.5 AC3 / ADR-009: every macOS build is signed with the one persistent
      # project identity, and CI fails if codesign reports an ad-hoc signature
      # or a different designated requirement.
      #
      # SECURITY (review F1): the signing material is available ONLY on pushes.
      # A same-repository pull_request receives secrets, so a PR branch could
      # otherwise read the .p12; the import and the signing build are therefore
      # scoped to `push`, and no step on a PR ever holds the secret.
      - name: Import the macOS signing identity (push only)
        id: macos-sign
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::notice::MACOS_CERTIFICATE is not configured; no macOS bundle is produced in CI. Releases are built by release.yml, which fails closed without the identity."
            echo "sign=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/release/import-macos-identity.sh
          echo "sign=yes" >> "$GITHUB_OUTPUT"
      - name: macOS app bundle must carry the pinned identity (ADR-009)
        if: runner.os == 'macOS' && steps.macos-sign.outputs.sign == 'yes'
        env:
          CARGO_INCREMENTAL: "0"
          APPLE_SIGNING_IDENTITY: Boba Job Find Self-Signed
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          bash scripts/release/build-sidecars.sh "$host"
          # S10.5 F1: the minisign key is release-only and CI never receives it,
          # so the committed updater pubkey must not make Tauri demand the
          # private key ("A public key has been found, but no private key").
          # Updater artifacts off: this bundle is the ADR-009 signature check,
          # not an updater payload (REL3).
          pnpm tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          node scripts/release/check-macos-signature.mjs "target/release/bundle/macos/Boba Job Find.app"
      - name: macOS signing skipped (pull request or unprovisioned)
        if: runner.os == 'macOS' && steps.macos-sign.outputs.sign != 'yes'
        run: |
          echo "::notice::No macOS bundle was produced: signing only runs on a push with MACOS_CERTIFICATE provisioned."
      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/boba-signing.keychain-db" 2>/dev/null || true
