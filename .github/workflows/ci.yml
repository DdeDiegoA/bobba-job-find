# CI — quality gate for Boba Job Find (S1.8, NFR-6/NFR-22).
#
# Runs on every PR and on pushes to main. No release, no signing, no secrets:
# the tag-driven release workflow is S10.5 (AD-22). This workflow never talks to
# a job board or an LLM; all fixtures are recorded (AD-16 / SPINE consistency).
#
# Every third-party action is pinned to a full commit SHA (enforced by
# scripts/ci/check-workflow-policy.mjs, run in the `hygiene` job).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Actions pinned by SHA, no job-board/LLM endpoints
        run: node scripts/ci/check-workflow-policy.mjs
      - name: stories.yaml fresh, deps acyclic, MVP FRs covered
        run: python3 scripts/gen_stories.py --check
      # S10.5 (AD-22): the updater pubkey in tauri.conf.json must stay a real
      # minisign public key, and the macOS identity pin must stay populated.
      - name: Release config guards
        run: |
          node scripts/release/verify-updater-pubkey.mjs
          grep -Eq '^BOBA_MACOS_CERT_SHA1=[0-9a-f]{40}$' scripts/release/macos-identity.pin || {
            echo "::error::scripts/release/macos-identity.pin has no pinned certificate (docs/install/RELEASING.md)"
            exit 1
          }

  web:
    name: Web (Biome, tsc, Vitest, i18n, bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile, dependency scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Biome (lint + format check)
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: i18n catalogs match in EN and ES
        run: node scripts/ci/check-i18n.mjs
      - name: Bindings are fresh
        # scripts/gen-bindings.mjs is owned by S1.3 (build convention 4/AD-3).
        run: |
          node scripts/gen-bindings.mjs
          git diff --exit-code -- src/lib/ipc/bindings.ts

  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    name: Tauri build (${{ matrix.os }})
    needs: [hygiene, web, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Step conditions below read `env.MACOS_CERTIFICATE`, so it lives at job
    # level: a fork PR gets an empty value (no secrets) and skips the bundle.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The MCP endpoint's owner-only DACL (S2.3b) is Windows code: its
      # `#[cfg(windows)]` test compiles on every platform but only runs here.
      - name: MCP proto tests (Windows pipe DACL)
        if: runner.os == 'Windows'
        run: cargo test --locked -p boba-mcp-proto
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            libssl-dev
      - name: Install (frozen lockfile, dependency scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tauri build, no bundle
        run: pnpm tauri build --no-bundle
      # S10.5 AC3 / ADR-009: every macOS build is signed with the one persistent
      # project identity, and CI fails if codesign reports an ad-hoc signature
      # or a different designated requirement. A fork's PR has no secrets and
      # produces no bundle, so there is nothing to sign (or publish) there.
      - name: Import the macOS signing identity
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/release/import-macos-identity.sh
      - name: macOS app bundle must carry the pinned identity (ADR-009)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          CARGO_INCREMENTAL: "0"
          APPLE_SIGNING_IDENTITY: Boba Job Find Self-Signed
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          bash scripts/release/build-sidecars.sh "$host"
          pnpm tauri build --bundles app
          node scripts/release/check-macos-signature.mjs "target/release/bundle/macos/Boba Job Find.app"
      - name: macOS signing skipped (no identity in this run)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE == ''
        run: |
          echo "::notice::MACOS_CERTIFICATE is not available in this run (fork PR or unprovisioned repository); no macOS bundle was produced. Releases are built by release.yml, which fails closed without the identity."
      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/boba-signing.keychain-db" 2>/dev/null || true
